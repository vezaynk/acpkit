name: live
# Registered with GitHub on the push that made this repository public.

# Drives a real ACP agent. This tier costs money and needs credentials, so it never runs on
# an untrusted trigger: pull_request_target is deliberately not used, and the job refuses to
# run for a pull request that came from a fork, where a contributor could otherwise read the
# secrets by editing the workflow.

on:
  workflow_dispatch:
    inputs:
      model:
        description: 'Model for goose to use'
        default: claude-haiku-4-5-20251001
        required: false
  pull_request:
    types: [labeled, synchronize]

permissions:
  contents: read

concurrency:
  # Per ref, so a re-push supersedes an in-flight run rather than paying for both.
  group: live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  goose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'run-e2e') &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOSE_PROVIDER: anthropic
      GOOSE_MODEL: ${{ inputs.model || 'claude-haiku-4-5-20251001' }}
      # goose reaches for the OS keyring by default, which does not exist on a runner.
      GOOSE_DISABLE_KEYRING: '1'
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install goose
        run: |
          curl -fsSL https://github.com/block/goose/releases/download/stable/download_cli.sh \
            | CONFIGURE=false bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Report the agent under test
        run: goose --version

      - name: Fail early if no credential is present
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is not set. Add it as a repository secret."
            exit 1
          fi

      - name: Live conformance
        env:
          ACPKIT_AGENT: goose
          ACPKIT_AGENT_ARGS: acp
        run: dotnet run --project tests/AcpKit.Live -c Release
